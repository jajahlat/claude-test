name: faydabook
description: Islamic ebook and audiobook app dedicated to the teachings of Shaykh Ibrahim Niass (radiyallahu anhu)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # Ebook Reading
  vocsy_epub_viewer: ^2.3.0
  flutter_pdfview: ^1.3.2

  # Audio Player
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.10
  audio_session: ^0.1.18

  # Storage & Database
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_storage: ^11.5.6
  cloud_firestore: ^4.13.6
  firebase_auth: ^4.15.3

  # Networking
  http: ^1.1.2
  dio: ^5.4.0

  # File Handling
  file_picker: ^6.1.1
  path: ^1.8.3

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  share_plus: ^7.2.1
  url_launcher: ^6.2.2

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Animations
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/books/
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
